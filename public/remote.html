<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV Remote</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0d12">
<style>
  :root {
    --bg: #0b0d12; --surface: #151923; --surface-2: #1d2230; --line: rgba(255,255,255,.08);
    --text: #f2f4f8; --muted: #8b93a7; --accent: #7482ff; --accent-ink: #fff; --ok: #3ddc97; --bad: #ff6b6b;
    --shadow: 0 10px 30px rgba(0,0,0,.45);
    --r: 16px; --mini-h: 68px;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f5f9; --surface: #fff; --surface-2: #eceef6; --line: rgba(15,20,40,.09);
      --text: #12141b; --muted: #667085; --accent: #4c5bff; --shadow: 0 10px 30px rgba(30,40,90,.16); color-scheme: light; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, "SF Pro Text", system-ui, Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  [hidden] { display: none !important; }
  svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.i.fill { fill: currentColor; stroke: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ---------- app bar ---------- */
  .app { max-width: 760px; margin: 0 auto; padding-bottom: calc(var(--mini-h) + 36px + env(safe-area-inset-bottom)); }
  .appbar { position: sticky; top: 0; z-index: 20; padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px); }
  .bar-row { display: flex; align-items: center; gap: 4px; min-height: 44px; }
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--text); }
  .icon-btn:active { background: var(--surface-2); }
  .title-wrap { flex: 1; min-width: 0; padding-left: 4px; }
  .title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title-sub { font-size: 13px; color: var(--muted); }
  #searchrow { display: none; margin-top: 8px; }
  #searchrow.on { display: block; }
  .field { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 0 14px; font: inherit; outline: none; }
  .field:focus { border-color: var(--accent); }
  .playon { width: 100%; margin-top: 10px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--r);
    background: var(--surface); border: 1px solid var(--line); text-align: left; }
  .playon:active { background: var(--surface-2); }
  .playon .glyph { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .playon .lbl { flex: 1; min-width: 0; }
  .playon .k { font-size: 12px; color: var(--muted); }
  .playon .v { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 6px; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }

  /* ---------- library ---------- */
  .section { padding: 18px 16px 6px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .list { padding: 0 12px; display: grid; gap: 6px; }
  .item { display: flex; align-items: center; gap: 14px; width: 100%; padding: 8px; border-radius: 14px; text-align: left; min-height: 64px; }
  .item:active { background: var(--surface); }
  .item.cur { background: color-mix(in srgb, var(--accent) 13%, transparent); }
  .thumb { position: relative; width: 104px; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; flex: none;
    background: linear-gradient(135deg, var(--surface-2), var(--surface)); display: grid; place-items: center; color: var(--muted); }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .3s; }
  .thumb img.ok { opacity: 1; }
  .folder-tile { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; flex: none;
    background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .meta { flex: 1; min-width: 0; }
  .t { font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .s { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item.cur .t { color: var(--accent); }
  .chev { color: var(--muted); margin-right: 4px; }
  .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; margin-right: 6px; flex: none; }
  .eq i { width: 3px; background: var(--accent); border-radius: 2px; animation: eq 1s ease-in-out infinite; height: 40%; }
  .eq i:nth-child(2) { animation-delay: .2s; } .eq i:nth-child(3) { animation-delay: .4s; }
  .eq.paused i { animation-play-state: paused; }
  @keyframes eq { 0%,100% { height: 25%; } 50% { height: 100%; } }
  .skel { height: 64px; margin: 0 12px 6px; border-radius: 14px; background: linear-gradient(90deg, var(--surface), var(--surface-2), var(--surface)); background-size: 200% 100%; animation: sk 1.2s linear infinite; }
  @keyframes sk { to { background-position: -200% 0; } }
  .empty { padding: 60px 24px; text-align: center; color: var(--muted); }
  .empty svg { width: 48px; height: 48px; margin-bottom: 8px; opacity: .6; }

  /* ---------- mini player ---------- */
  .mini { position: fixed; z-index: 30; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); max-width: 736px; margin: 0 auto; height: var(--mini-h);
    border-radius: 20px; background: color-mix(in srgb, var(--surface-2) 88%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--line); box-shadow: var(--shadow); display: none; align-items: center; gap: 12px; padding: 0 8px 0 10px; overflow: hidden; }
  .mini.on { display: flex; }
  .mini .mthumb { width: 48px; height: 48px; border-radius: 12px; overflow: hidden; position: relative; background: var(--surface); flex: none; display: grid; place-items: center; color: var(--muted); }
  .mini .mthumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .mini .mmeta { flex: 1; min-width: 0; text-align: left; }
  .mini .mt { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .ms { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .prog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); width: 0; transition: width .5s linear; }

  /* ---------- full player ---------- */
  .player { position: fixed; z-index: 40; inset: 0; transform: translateY(104%); transition: transform .35s cubic-bezier(.2,.8,.2,1); background: var(--bg);
    overflow-y: auto; overscroll-behavior: contain; visibility: hidden; }
  .player.open { transform: none; visibility: visible; }
  .player::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 55vh; background-image: var(--poster); background-size: cover; background-position: center;
    filter: blur(60px) saturate(1.4); opacity: .32; pointer-events: none; }
  .p-inner { position: relative; max-width: 560px; margin: 0 auto; padding: calc(8px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom)); }
  .p-top { display: flex; align-items: center; justify-content: space-between; height: 48px; }
  .p-top .mid { text-align: center; font-size: 12px; color: var(--muted); line-height: 1.3; }
  .p-top .mid b { display: block; font-size: 14px; color: var(--text); font-weight: 600; }
  .stage { position: relative; margin-top: 8px; aspect-ratio: 16/9; border-radius: 20px; overflow: hidden; background: #000; box-shadow: var(--shadow); }
  .stage video, .stage .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .stage .poster { object-fit: cover; opacity: .9; }
  .stage .badge { position: absolute; left: 12px; top: 12px; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; background: rgba(0,0,0,.55); color: #fff; backdrop-filter: blur(8px); display: flex; align-items: center; gap: 6px; }
  .stage .fsbtn { position: absolute; right: 8px; bottom: 8px; width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; display: none; place-items: center; }
  .stage.phone .fsbtn { display: grid; }
  .stage.phone .poster, .stage.phone .badge { display: none; }
  .stage:not(.phone) video { display: none; }
  .p-title { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin: 20px 0 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .p-sub { font-size: 14px; color: var(--muted); }
  .seek { margin-top: 18px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; --p: 0%; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 6px; background: linear-gradient(to right, var(--accent) var(--p), color-mix(in srgb, var(--muted) 30%, transparent) var(--p)); }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 6px; background: color-mix(in srgb, var(--muted) 30%, transparent); }
  input[type=range]::-moz-range-progress { height: 6px; border-radius: 6px; background: var(--accent); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border: 0; border-radius: 50%; background: #fff; }
  .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: -2px; }
  .transport { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 6px; }
  .tbtn { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; }
  .tbtn:active { background: var(--surface-2); }
  .tbtn svg.i { width: 30px; height: 30px; }
  .playbtn { width: 76px; height: 76px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 45%, transparent); }
  .playbtn:active { transform: scale(.96); }
  .playbtn svg.i { width: 34px; height: 34px; }
  .chips { display: flex; gap: 10px; margin-top: 14px; }
  .chip { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-align: left; }
  .chip:active { background: var(--surface-2); }
  .chip[hidden] { display: none; }
  .chip .ck { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .chip .cv { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip .lbl { min-width: 0; flex: 1; }
  .volrow { display: flex; align-items: center; gap: 10px; margin-top: 14px; color: var(--muted); }
  .volrow input { flex: 1; }
  .stopbtn { margin-top: 18px; width: 100%; height: 48px; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--bad) 45%, transparent); color: var(--bad); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .stopbtn:active { background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .banner { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); font-size: 14px; display: none; }
  .banner.on { display: block; }

  /* ---------- sheets / toast ---------- */
  .backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .backdrop.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; z-index: 61; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; max-height: 82vh; overflow-y: auto; border-radius: 24px 24px 0 0; background: var(--surface);
    transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1); padding: 8px 8px calc(16px + env(safe-area-inset-bottom)); box-shadow: var(--shadow); }
  .sheet.on { transform: none; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--muted) 50%, transparent); margin: 4px auto 6px; }
  .sheet h2 { font-size: 18px; margin: 6px 12px 10px; }
  .opt { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px; border-radius: 14px; text-align: left; min-height: 56px; }
  .opt:active { background: var(--surface-2); }
  .opt .glyph { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); flex: none; }
  .opt.sel .glyph { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .opt .lbl { flex: 1; min-width: 0; }
  .opt .o1 { font-weight: 600; }
  .opt .o2 { font-size: 13px; color: var(--muted); word-break: break-word; }
  .opt .tick { color: var(--accent); }
  .switch { position: relative; width: 52px; height: 32px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border-radius: 16px; background: color-mix(in srgb, var(--muted) 35%, transparent); transition: .2s; pointer-events: none; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .hr { height: 1px; background: var(--line); margin: 6px 12px; }
  pre.logs { margin: 4px 12px 12px; padding: 12px; border-radius: 12px; background: var(--bg); font: 11px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; color: var(--muted); max-height: 55vh; overflow: auto; }
  .toast { position: fixed; z-index: 80; left: 50%; bottom: calc(var(--mini-h) + 30px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: .25s;
    background: var(--surface-2); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 12px 16px; border-radius: 14px; max-width: calc(100% - 32px); font-size: 14px; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- folder picker ---------- */
  .picker { position: fixed; z-index: 90; inset: 0; background: var(--bg); display: none; flex-direction: column; }
  .picker.on { display: flex; }
  .pk-head { padding: calc(10px + env(safe-area-inset-top)) 16px 12px; border-bottom: 1px solid var(--line); }
  .pk-head .path { font-size: 13px; color: var(--muted); word-break: break-all; margin: 4px 0 12px; }
  .pk-actions { display: flex; gap: 10px; }
  .btn { height: 46px; padding: 0 18px; border-radius: 14px; font-weight: 600; background: var(--surface-2); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); flex: 1; }
  .btn:disabled { opacity: .45; }
  .pk-list { flex: 1; overflow-y: auto; padding: 8px 12px calc(20px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>

<!-- icons -->

<div class="app" id="app">
  <header class="appbar">
    <div class="bar-row">
      <button class="icon-btn" id="backbtn" aria-label="Back" hidden><svg class="i"><use href="#i-left"/></svg></button>
      <div class="title-wrap"><div class="title" id="ttl">Library</div><div class="title-sub" id="ttlsub">&nbsp;</div></div>
      <button class="icon-btn" id="searchbtn" aria-label="Search"><svg class="i"><use href="#i-search"/></svg></button>
      <button class="icon-btn" id="setbtn" aria-label="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
    </div>
    <div id="searchrow"><input class="field" id="q" type="search" placeholder="Search all folders" autocomplete="off"></div>
    <button class="playon" id="playon" aria-label="Choose where to play">

<script src="/hls.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ico = (name, cls = '') => `<svg class="i ${cls}"><use href="#i-${name}"/></svg>`;
const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const join = (a, b) => (a ? a + '/' : '') + b;
const baseName = (p) => p.split('/').pop();
const encPath = (p) => p.split('/').map(encodeURIComponent).join('/');
const thumbUrl = (p) => '/api/thumb?path=' + encodeURIComponent(p);

// Turn "[grp].Show.Name.S01E02.1080p.BluRay.x265-GRP.mkv" into "Show Name S01E02".
function prettyName(file, isFile = true) {
  let n = (isFile ? file.replace(/\.[^.]+$/, '') : file).replace(/\[[^\]]*\]/g, ' ');
  n = /\s/.test(n.replace(/\(.*?\)/g, '').trim()) ? n.replace(/_/g, ' ') : n.replace(/[._]+/g, ' ');
  const cut = n.search(/\b(2160p|1080p|720p|480p|4k|blu-?ray|brrip|bdrip|web-?dl|webrip|hdtv|dvdrip|x26[45]|h\.?26[45]|hevc|10bit|dual[ -]audio|aac|ac3|ddp?5)\b/i);
  if (cut > 3) n = n.slice(0, cut);
  n = n.replace(/\s+/g, ' ').replace(/[\s\-–.]+$/, '').trim();
  return n || file;
}
function detailName(file) {
  const ext = (file.match(/\.([^.]+)$/) || [, ''])[1].toUpperCase();
  const m = file.match(/S(\d{1,2})E(\d{1,3})/i) || file.match(/Episode[ ._]?(\d{1,3})/i);
  const ep = !m ? '' : m.length > 2 ? `Season ${+m[1]} · Episode ${+m[2]}` : `Episode ${+m[1]}`;
  return [ep, ext].filter(Boolean).join(' · ');
}

// ---------------------------------------------------------------- state
let phoneMode = false, autoPhone = false, savedTarget = null, targetChecked = false;
try { savedTarget = localStorage.getItem('target'); phoneMode = savedTarget === 'phone'; } catch {}
let S = { devices: [], target: null, tv: false, tracks: { audio: [], subs: [] } }; // latest server state
let vm = { active: false, path: null, title: '', paused: true, time: 0, duration: 0, volume: 0.25, tracks: { audio: [], subs: [] }, audio: 0, sub: -1, error: '', index: -1, count: 0, direct: false, loading: false };
let curPath = null, dragging = false, lastFiles = [], listing = null, filterText = '', shown = {}, searchRes = null, searchSeq = 0, searchTimer = null, searching = false;

const serverCmd = (c) => fetch('/api/cmd', { method: 'POST', body: JSON.stringify(c) });
const cmd = (c) => (phoneMode ? localCmd(c) : serverCmd(c));

let toastTimer;
function toast(msg, ms = 3500) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), ms); }

// ---------------------------------------------------------------- library
async function browse(p) {
  $('list').innerHTML = '<div class="skel"></div>'.repeat(6);
  let r;
  try { r = await fetch('/api/list?path=' + encodeURIComponent(p)).then((r) => r.json()); } catch { $('list').innerHTML = '<div class="empty">Could not reach the server.</div>'; return; }
  listing = r; clearSearch();
  lastFiles = r.files.map((n) => join(r.path, n));
  shown = {};
  const names = r.files.map((n) => prettyName(n));
  let pre = names.length > 2 ? names[0].split(' ') : [];
  for (const nm of names) { const w = nm.split(' '); let k = 0; while (k < pre.length && k < w.length && pre[k] === w[k]) k++; pre = pre.slice(0, k); }
  const strip = pre.join(' ');
  r.files.forEach((n, i) => { const rest = strip && names[i].startsWith(strip + ' ') ? names[i].slice(strip.length + 1).trim() : names[i]; shown[n] = rest || names[i]; });
  renderList(); renderBar();
  window.scrollTo(0, 0);
}
function renderBar() {
  if (!listing) return;
  const dir = listing.path, parts = dir ? dir.split('/') : [];
  $('ttl').textContent = parts.length ? prettyName(parts[parts.length - 1], false) : (listing.rootName ? prettyName(listing.rootName, false) : 'Library');
  const nf = listing.files.length, nd = listing.dirs.length;
  $('ttlsub').textContent = [nd ? `${nd} folder${nd > 1 ? 's' : ''}` : '', nf ? `${nf} video${nf > 1 ? 's' : ''}` : ''].filter(Boolean).join(' · ') || 'No videos here';
  $('backbtn').hidden = !dir;
}
function renderSearch() {
  const r = searchRes, q = filterText.trim();
  let h = `<div class="section">${r.total ? `${r.total} result${r.total === 1 ? '' : 's'} in all folders` : 'No results'}</div>`;
  if (r.dirs.length) h += `<div class="list">` + r.dirs.map((d) =>
    `<button class="item" data-kind="dir" data-p="${esc(d.path)}"><span class="folder-tile">${ico('folder')}</span><span class="meta"><span class="t">${esc(prettyName(d.name, false))}</span><span class="s">${esc(prettyName(d.path.split('/').slice(0, -1).join(' / '), false) || 'Library')}</span></span><span class="chev">${ico('right')}</span></button>`).join('') + `</div>`;
  if (r.files.length) h += `<div class="section">Videos</div><div class="list">` + r.files.map((f) => {
    const cur = f.path === curPath, where = f.dir ? f.dir.split('/').map((x) => prettyName(x, false)).join(' › ') : 'Library';
    return `<button class="item${cur ? ' cur' : ''}" data-kind="file" data-p="${esc(f.path)}" title="${esc(f.name)}">` +
      `<span class="thumb">${ico('film')}<img loading="lazy" decoding="async" alt="" src="${thumbUrl(f.path)}" onload="this.classList.add('ok')" onerror="this.remove()"></span>` +
      `<span class="meta"><span class="t">${esc(prettyName(f.name))}</span><span class="s">${esc(where)}</span></span>` +
      (cur ? `<span class="eq${vm.paused ? ' paused' : ''}"><i></i><i></i><i></i></span>` : '') + `</button>`;
  }).join('') + `</div>`;
  if (r.truncated) h += `<div class="empty" style="padding:16px">Showing the first ${r.files.length}. Type more of the name to narrow it down.</div>`;
  if (!r.total) h += `<div class="empty">${ico('search')}<div>Nothing matches “${esc(q)}”.</div></div>`;
  lastFiles = r.files.map((f) => f.path); // next/previous follow the search results
  $('list').innerHTML = h;
}
function renderList() {
  if (!listing) return;
  if (searchRes && searchRes.q === filterText.trim() && filterText.trim().length >= 2) return renderSearch();
  const f = filterText.trim().toLowerCase();
  const dirs = listing.dirs.filter((n) => !f || prettyName(n, false).toLowerCase().includes(f) || n.toLowerCase().includes(f));
  const files = listing.files.filter((n) => !f || prettyName(n).toLowerCase().includes(f) || n.toLowerCase().includes(f));
  let h = '';
  if (dirs.length) h += `<div class="section">Folders</div><div class="list">` + dirs.map((n) =>
    `<button class="item" data-kind="dir" data-p="${esc(join(listing.path, n))}"><span class="folder-tile">${ico('folder')}</span><span class="meta"><span class="t">${esc(prettyName(n, false))}</span></span><span class="chev">${ico('right')}</span></button>`).join('') + `</div>`;
  if (files.length) h += `<div class="section">Videos</div><div class="list">` + files.map((n) => {
    const p = join(listing.path, n), cur = p === curPath;
    return `<button class="item${cur ? ' cur' : ''}" data-kind="file" data-p="${esc(p)}" title="${esc(n)}">` +
      `<span class="thumb">${ico('film')}<img loading="lazy" decoding="async" alt="" src="${thumbUrl(p)}" onload="this.classList.add('ok')" onerror="this.remove()"></span>` +
      `<span class="meta"><span class="t">${esc(shown[n] || prettyName(n))}</span><span class="s">${esc(detailName(n))}</span></span>` +
      (cur ? `<span class="eq${vm.paused ? ' paused' : ''}"><i></i><i></i><i></i></span>` : '') + `</button>`;
  }).join('') + `</div>`;
  if (f.length >= 2 && searching) h = `<div class="section">Searching all folders…</div>` + h;
  if (!h) h = `<div class="empty">${ico('film')}<div>${f ? 'Nothing matches that filter.' : 'No videos in this folder.'}</div></div>`;
  lastFiles = listing.files.map((n) => join(listing.path, n));
  $('list').innerHTML = h;
}
$('list').addEventListener('click', (e) => {
  const b = e.target.closest('.item'); if (!b) return;
  if (b.dataset.kind === 'dir') { clearSearch(); browse(b.dataset.p); return; }
  if (phoneMode) openPlayer();
  cmd({ type: 'play', path: b.dataset.p });
});
$('backbtn').onclick = () => { if (listing && listing.path) browse(listing.path.split('/').slice(0, -1).join('/')); };
$('searchbtn').onclick = () => { const r = $('searchrow'); if (r.classList.contains('on')) { clearSearch(); renderList(); } else { r.classList.add('on'); $('q').focus(); } };
async function runSearch() {
  const q = filterText.trim(), seq = ++searchSeq;
  searching = true; renderList();
  let r;
  try { r = await fetch('/api/search?q=' + encodeURIComponent(q)).then((r) => r.json()); } catch { searching = false; return; }
  if (seq !== searchSeq) return;
  searching = false; searchRes = { ...r, q }; renderList();
}
function clearSearch() { clearTimeout(searchTimer); searchSeq++; searchRes = null; searching = false; filterText = ''; $('q').value = ''; $('searchrow').classList.remove('on'); }
$('q').oninput = (e) => {
  filterText = e.target.value; clearTimeout(searchTimer);
  if (filterText.trim().length < 2) { searchSeq++; searchRes = null; searching = false; renderList(); return; }
  renderList(); searchTimer = setTimeout(runSearch, 250);
};

// ---------------------------------------------------------------- rendering of the player
function setRange(el) { const max = Number(el.max) || 1; el.style.setProperty('--p', Math.min(100, Math.max(0, (Number(el.value) / max) * 100)) + '%'); }
function targetInfo() {
  if (phoneMode) return { name: 'This phone', icon: 'phone', ok: true, short: 'this phone' };
  if (S.target) return { name: S.target, icon: 'cast', ok: true, short: S.target };
  return { name: 'TV browser page', icon: 'tv', ok: !!S.tv, short: 'the TV page' };
}
function renderTarget() {
  const t = targetInfo();
  $('po-name').textContent = t.name; $('po-ic').innerHTML = `<use href="#i-${t.icon}"/>`;
  $('po-dot').className = 'dot ' + (t.ok ? 'ok' : 'bad');
  $('p-on').textContent = 'on ' + t.short;
}
let lastPoster = null;
function render() {
  const t = targetInfo();
  curPath = vm.active ? vm.path : null;
  document.querySelectorAll('.item[data-kind=file]').forEach((b) => {
    const cur = b.dataset.p === curPath; b.classList.toggle('cur', cur);
    let eq = b.querySelector('.eq');
    if (cur && !eq) { b.insertAdjacentHTML('beforeend', '<span class="eq"><i></i><i></i><i></i></span>'); eq = b.querySelector('.eq'); }
    if (!cur && eq) eq.remove();
    if (eq) eq.classList.toggle('paused', vm.paused);
  });
  $('mini').classList.toggle('on', vm.active);
  $('app').style.setProperty('--mini-h', vm.active ? '68px' : '0px');
  const pretty = vm.active ? prettyName(baseName(vm.path)) : 'Nothing playing';
  const where = vm.loading ? 'Converting for playback…' : `${vm.paused ? 'Paused' : 'Playing'} on ${t.short}`;
  $('mt').textContent = pretty; $('ms').textContent = where;
  $('p-title').textContent = pretty;
  $('p-sub').textContent = vm.active ? [vm.count > 1 ? `${vm.index + 1} of ${vm.count}` : '', where].filter(Boolean).join(' · ') : ' ';
  const ic = vm.paused ? 'play' : 'pause';
  $('mplay-ic').innerHTML = `<use href="#i-${ic}"/>`; $('toggle-ic').innerHTML = `<use href="#i-${ic}"/>`;
  $('mprog').style.width = (vm.duration ? Math.min(100, vm.time / vm.duration * 100) : 0) + '%';
  if (!dragging) { $('seek').max = vm.duration || 1; $('seek').value = vm.time || 0; setRange($('seek')); $('cur').textContent = fmt(vm.time); }
  $('dur').textContent = vm.duration ? fmt(vm.duration) : '--:--';
  if (document.activeElement !== $('vol')) { $('vol').value = vm.volume; setRange($('vol')); }
  $('stage').classList.toggle('phone', phoneMode);
  $('badge-t').textContent = 'Casting to ' + t.short;
  const poster = vm.active ? thumbUrl(vm.path) : '';
  if (poster !== lastPoster) {
    lastPoster = poster;
    $('poster').src = poster; $('poster').style.visibility = poster ? '' : 'hidden';
    $('mthumb').innerHTML = poster ? `<img alt="" src="${poster}" onerror="this.remove()">${ico('film')}` : ico('film');
    $('player').style.setProperty('--poster', poster ? `url("${poster}")` : 'none');
  }
  const tr = vm.tracks || { audio: [], subs: [] };
  $('achip').hidden = !(tr.audio.length > 1 && !vm.direct);
  $('schip').hidden = !tr.subs.length;
  $('achip-v').textContent = tr.audio[vm.audio] || '—';
  $('schip-v').textContent = vm.sub >= 0 && tr.subs[vm.sub] ? tr.subs[vm.sub] : 'Off';
  const b = $('banner'); b.textContent = vm.error || ''; b.classList.toggle('on', !!vm.error);

}

// ---------------------------------------------------------------- player open/close
function openPlayer() { $('player').classList.add('open'); document.body.style.overflow = 'hidden'; }
function closePlayer() { $('player').classList.remove('open'); document.body.style.overflow = ''; }
$('mthumb').onclick = $('mmeta').onclick = openPlayer;
$('pclose').onclick = closePlayer;
$('mplay').onclick = () => cmd({ type: 'toggle' });
$('mnext').onclick = () => cmd({ type: 'next' });
$('toggle').onclick = () => cmd({ type: 'toggle' });
$('prev').onclick = () => cmd({ type: 'prev' });
$('next').onclick = () => cmd({ type: 'next' });
$('back').onclick = () => cmd({ type: 'seek', delta: -10 });
$('fwd').onclick = () => cmd({ type: 'seek', delta: 30 });
$('stop').onclick = () => { cmd({ type: 'stop' }); closePlayer(); };
$('vol').oninput = (e) => { setRange(e.target); cmd({ type: 'volume', value: e.target.value }); };
$('seek').addEventListener('input', (e) => { dragging = true; setRange(e.target); $('cur').textContent = fmt(e.target.value); });
$('seek').addEventListener('change', (e) => { cmd({ type: 'seek', to: e.target.value }); dragging = false; });

// ---------------------------------------------------------------- sheets
function openSheet(title, html, bind) {
  $('sheet-title').textContent = title; $('sheet-body').innerHTML = html;
  $('backdrop').classList.add('on'); $('sheet').classList.add('on');
  if (bind) bind($('sheet-body'));
}
function closeSheet() { $('backdrop').classList.remove('on'); $('sheet').classList.remove('on'); clearInterval(logTimer); }
$('backdrop').onclick = closeSheet;

// Swipe down to dismiss: used by the bottom sheets and the full player.
function dragToDismiss(el, { canStart, onClose, threshold = 90 }) {
  let y0 = 0, dy = 0, t0 = 0, active = false, decided = false;
  el.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1 || !canStart(e)) { active = false; return; }
    y0 = e.touches[0].clientY; dy = 0; t0 = Date.now(); active = true; decided = false;
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    if (!active) return;
    dy = e.touches[0].clientY - y0;
    if (!decided) { if (Math.abs(dy) < 6) return; decided = true; if (dy < 0) { active = false; return; } el.style.transition = 'none'; } // upward = normal scroll
    if (e.cancelable) e.preventDefault();
    el.style.transform = `translateY(${Math.max(0, dy)}px)`;
  }, { passive: false });
  const end = () => {
    if (!active || !decided) { active = false; return; }
    active = false;
    el.style.transition = '';
    const fast = dy / Math.max(1, Date.now() - t0) > 0.6;
    if (dy > threshold || fast) { onClose(); }
    el.style.transform = ''; // class change animates it from where the finger left it
  };
  el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
}
dragToDismiss($('sheet'), {
  canStart: (e) => $('sheet').scrollTop <= 0 || !!e.target.closest('.grab, h2'),
  onClose: () => closeSheet(),
});
dragToDismiss($('player'), {
  canStart: (e) => $('player').scrollTop <= 0 && !e.target.closest('input[type=range], video, .chip, button.playbtn'),
  onClose: () => closePlayer(), threshold: 110,
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($('picker').classList.contains('on')) $('pkcancel').click(); else if ($('sheet').classList.contains('on')) closeSheet(); else if ($('player').classList.contains('open')) closePlayer(); } });
function optionSheet(title, options, onPick) { // options: [{icon,label,sub,selected}]
  openSheet(title, options.map((o, i) => `<button class="opt${o.selected ? ' sel' : ''}" data-i="${i}"><span class="glyph">${ico(o.icon || 'check')}</span><span class="lbl"><div class="o1">${esc(o.label)}</div>${o.sub ? `<div class="o2">${esc(o.sub)}</div>` : ''}</span>${o.selected ? `<span class="tick">${ico('check')}</span>` : ''}</button>`).join(''),
    (el) => el.querySelectorAll('.opt').forEach((b) => { b.onclick = () => { closeSheet(); onPick(Number(b.dataset.i)); }; }));
}
$('playon').onclick = () => {
  const cur = phoneMode ? '__phone__' : (S.target || '');
  const opts = [{ v: '__phone__', icon: 'phone', label: 'This phone', sub: 'Plays right here in your browser' },
    ...S.devices.map((d) => ({ v: d, icon: 'cast', label: d, sub: 'Cast to this TV' })),
    { v: '', icon: 'tv', label: 'TV browser page', sub: S.tv ? 'Open and ready' : 'Open /tv in the TV’s browser first' }];
  optionSheet('Play on', opts.map((o) => ({ ...o, selected: o.v === cur })), (i) => setTarget(opts[i].v));
};
$('achip').onclick = () => optionSheet('Audio', vm.tracks.audio.map((l, i) => ({ icon: 'audio', label: l, selected: i === vm.audio })), (i) => cmd({ type: 'track', audio: i }));
$('schip').onclick = () => optionSheet('Subtitles', [{ icon: 'x', label: 'Off', selected: vm.sub < 0 }, ...vm.tracks.subs.map((l, i) => ({ icon: 'cc', label: l, selected: i === vm.sub }))], (i) => cmd({ type: 'track', sub: i - 1 }));

function setTarget(v) {
  autoPhone = false;
  try { localStorage.setItem('target', v === '__phone__' ? 'phone' : v); } catch {}
  if (v === '__phone__') { if (phoneMode) return; phoneMode = true; vm.volume = pv.volume = 1; resetLocalVm(); }
  else { if (phoneMode) { stopLocal(); phoneMode = false; } serverCmd({ type: 'target', name: v || null }); vm = { ...vm, active: !!S.path, path: S.path || null }; }
  renderTarget(); render();
}

// ---------------------------------------------------------------- settings
let settings = { endOnStop: false, castArtwork: true, castSubs: true };
fetch('/api/settings').then((r) => r.json()).then((r) => { settings = r; });
const saveSetting = (k, v) => { settings[k] = v; return fetch('/api/settings', { method: 'POST', body: JSON.stringify({ [k]: v }) }); };
function toggleRow(id, title, sub, on) {
  return `<label class="opt" for="${id}"><span class="lbl"><div class="o1">${title}</div><div class="o2">${sub}</div></span><span class="switch"><input type="checkbox" id="${id}"${on ? ' checked' : ''}><span></span></span></label>`;
}
function openSettings() {
  const folder = listing ? listing.rootName : '';
  openSheet('Settings',
    `<button class="opt" id="s-folder"><span class="glyph">${ico('folder')}</span><span class="lbl"><div class="o1">Media folder</div><div class="o2" id="s-folder-name">${esc(folder)}</div></span>${ico('right', 'chev')}</button>` +
    `<div class="hr"></div>` +
    toggleRow('s-art', 'Poster image on the TV', 'Shows the video’s picture while casting.', settings.castArtwork) +
    toggleRow('s-subs', 'Send text subtitles to the TV', 'Turn off if the TV struggles with subtitles.', settings.castSubs) +
    toggleRow('s-end', 'Close TV cast screen on Stop', 'Fully ends the cast. Some TVs switch input when it closes.', settings.endOnStop) +
    `<div class="hr"></div>` +
    `<button class="opt" id="s-logs"><span class="glyph">${ico('log')}</span><span class="lbl"><div class="o1">View logs</div><div class="o2">Server activity, for troubleshooting</div></span>${ico('right', 'chev')}</button>` +
    `<div class="o2" style="padding:6px 14px 4px">Server: ${esc(location.host)}</div>`,
    (el) => {
      el.querySelector('#s-folder').onclick = () => { closeSheet(); openPicker(); };
      el.querySelector('#s-logs').onclick = openLogs;
      el.querySelector('#s-art').onchange = (e) => saveSetting('castArtwork', e.target.checked);
      el.querySelector('#s-subs').onchange = (e) => saveSetting('castSubs', e.target.checked);
      el.querySelector('#s-end').onchange = (e) => saveSetting('endOnStop', e.target.checked);
    });
}
$('setbtn').onclick = openSettings; $('pset').onclick = openSettings;
let logTimer;
function openLogs() {
  openSheet('Logs', '<pre class="logs" id="logs">Loading…</pre>');
  const load = async () => { try { const r = await fetch('/api/logs').then((r) => r.json()); const el = $('logs'); if (!el) return; const end = el.scrollTop + el.clientHeight >= el.scrollHeight - 20; el.textContent = r.logs.join('\n') || '(no log lines yet)'; if (end) el.scrollTop = el.scrollHeight; } catch {} };
  load(); clearInterval(logTimer); logTimer = setInterval(load, 2000);
}

// ---------------------------------------------------------------- folder picker
let pkCur = '';
async function pick(p) {
  const r = await fetch('/api/dirs?path=' + encodeURIComponent(p)).then((r) => r.json()).catch(() => ({ error: 'Could not reach the server' }));
  if (r.error) { $('pkerr').textContent = r.error; return; }
  $('pkerr').textContent = ''; pkCur = r.path;
  $('pkpath').textContent = r.path || 'Pick a location';
  $('pkuse').disabled = !r.path;
  $('pkuse').textContent = r.path ? `Use this folder (${r.videos} video${r.videos === 1 ? '' : 's'})` : 'Use this folder';
  const up = r.path ? `<button class="item" data-p="${esc(r.parent)}"><span class="folder-tile" style="background:var(--surface-2);color:var(--muted)">${ico('up')}</span><span class="meta"><span class="t">${r.parent ? 'Up one level' : 'All locations'}</span></span></button>` : '';
  $('pklist').innerHTML = up + r.dirs.map((d) => `<button class="item" data-p="${esc(d.path)}"><span class="folder-tile">${ico('folder')}</span><span class="meta"><span class="t">${esc(d.name)}</span></span><span class="chev">${ico('right')}</span></button>`).join('');
  $('pklist').scrollTop = 0;
}
function openPicker() { $('picker').classList.add('on'); pick(''); }
$('pkcancel').onclick = () => $('picker').classList.remove('on');
$('pklist').addEventListener('click', (e) => { const b = e.target.closest('.item'); if (b) pick(b.dataset.p); });
$('pkuse').onclick = async () => {
  const r = await fetch('/api/root', { method: 'POST', body: JSON.stringify({ path: pkCur }) }).then((r) => r.json()).catch(() => ({ error: 'Could not reach the server' }));
  if (r.error) { $('pkerr').textContent = r.error; return; }
  if (phoneMode) await stopLocal();
  $('picker').classList.remove('on'); browse(''); toast('Media folder changed');
};

// ---------------------------------------------------------------- server state (casting / TV page)
const es = new EventSource('/events?role=remote');
es.addEventListener('state', (e) => {
  const s = JSON.parse(e.data); S = s;
  // First time here: go back to the TV used last time (or the only TV on the network) rather than the TV browser page.
  if (!targetChecked && s.devices.length) {
    targetChecked = true;
    const want = savedTarget && s.devices.includes(savedTarget) ? savedTarget : (savedTarget === null && s.devices.length === 1 ? s.devices[0] : null);
    if (!phoneMode && !s.target && !s.tv && want) { serverCmd({ type: 'target', name: want }); s.target = want; }
  }
  // No TV anywhere → use this phone. If a TV shows up later and we only chose the phone automatically, switch back.
  if (!phoneMode && !s.devices.length && !s.tv && !s.path && !s.target) { phoneMode = true; autoPhone = true; resetLocalVm(); }
  else if (phoneMode && autoPhone && (s.devices.length || s.tv)) { stopLocal(); phoneMode = false; autoPhone = false; }
  renderTarget();
  if (phoneMode) { render(); return; }
  vm = { active: !!s.path, path: s.path, paused: s.paused, time: s.time || 0, duration: s.duration || 0, volume: s.volume,
    tracks: s.tracks || { audio: [], subs: [] }, audio: s.audio, sub: s.sub, error: s.error || '', index: s.index, count: s.count, direct: !(s.tracks && s.tracks.audio.length), loading: false };
  render();
});
es.onerror = () => { vm.error = 'Lost connection to the server — retrying…'; render(); };
es.onopen = () => { if (vm.error.startsWith('Lost connection')) { vm.error = ''; render(); } };

// ---------------------------------------------------------------- playing on this phone
const pv = $('pv');
const L = { queue: [], idx: -1, info: null, offset: 0, sid: null, a: 0, s: -1, hls: null };
const cur = () => L.offset + (pv.currentTime || 0);
const dur = () => (L.info && L.info.duration) || pv.duration || 0;
function resetLocalVm() { vm = { active: false, path: null, title: '', paused: true, time: 0, duration: 0, volume: pv.volume, tracks: { audio: [], subs: [] }, audio: 0, sub: -1, error: '', index: -1, count: 0, direct: false, loading: false }; }
function updateLocal() {
  if (!phoneMode || L.idx < 0) return;
  vm = { ...vm, active: true, path: L.queue[L.idx], paused: pv.paused, time: cur(), duration: dur(), volume: pv.volume,
    tracks: L.info ? { audio: L.info.audio, subs: L.info.subs } : vm.tracks, audio: L.a, sub: L.s, index: L.idx, count: L.queue.length, direct: !!(L.info && L.info.direct) };
  render();
}
async function stopSession() {
  if (L.hls) { L.hls.destroy(); L.hls = null; }
  if (L.sid) { navigator.sendBeacon('/api/hls/stop', JSON.stringify({ sid: L.sid })); L.sid = null; }
}
async function stopLocal() {
  pv.pause(); pv.removeAttribute('src'); pv.load(); await stopSession();
  L.idx = -1; L.queue = []; L.info = null; resetLocalVm(); render();
}
function applySoftSub() { // text subtitles ride along as a WebVTT track, timed from where this stream started
  pv.querySelectorAll('track').forEach((t) => t.remove());
  if (!L.info || L.s < 0 || (L.info.subKinds || [])[L.s] !== 'text') return;
  const t = document.createElement('track');
  t.kind = 'subtitles'; t.default = true;
  t.src = `/api/sub?path=${encodeURIComponent(L.queue[L.idx])}&s=${L.s}&start=${L.offset}`;
  pv.appendChild(t); t.track.mode = 'showing';
}
async function loadAt(t) {
  const path = L.queue[L.idx];
  await stopSession();
  vm.error = '';
  if (L.info.direct) {
    L.offset = 0; vm.loading = false; pv.src = '/media/' + encPath(path);
    if (t) pv.addEventListener('loadedmetadata', () => { pv.currentTime = t; }, { once: true });
  } else {
    vm.loading = true; updateLocal();
    const r = await fetch('/api/hls', { method: 'POST', body: JSON.stringify({ path, start: t, a: L.a, s: L.s }) }).then((r) => r.json()).catch(() => ({ error: 'network' }));
    if (!r.url) { vm.loading = false; vm.error = 'Could not start playback: ' + (r.error || 'unknown'); updateLocal(); return; }
    L.sid = r.sid; L.offset = t;
    if (window.Hls && Hls.isSupported()) {
      L.hls = new Hls(); L.hls.loadSource(r.url); L.hls.attachMedia(pv);
      L.hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) { vm.loading = false; vm.error = 'Playback error (' + d.details + ')'; updateLocal(); } });
    } else if (pv.canPlayType('application/vnd.apple.mpegurl')) { pv.src = r.url;
    } else { vm.loading = false; vm.error = "This browser can't play converted video"; updateLocal(); return; }
  }
  applySoftSub();
  pv.play().catch(() => {});
  updateLocal();
}
async function playLocal(path, keepTracks) {
  if (!L.queue.includes(path) || !lastFiles.includes(path)) L.queue = lastFiles.includes(path) ? lastFiles.slice() : [path];
  L.idx = L.queue.indexOf(path);
  vm = { ...vm, active: true, path, error: '', loading: false, time: 0, duration: 0 }; render();
  let info;
  try { info = await fetch('/api/info?path=' + encodeURIComponent(path)).then((r) => r.json()); } catch { vm.error = 'Could not reach the server'; render(); return; }
  const same = keepTracks && L.info && L.info.audio.length === info.audio.length && L.info.subs.length === info.subs.length;
  if (!same) { L.a = info.a; L.s = info.s; }
  L.info = info;
  await loadAt(0);
}
function seekLocal(t) {
  t = Math.max(0, Math.min(t, dur() || t));
  if (!L.info) return;
  if (L.info.direct) { pv.currentTime = t; return; }
  const rel = t - L.offset, sk = pv.seekable;
  if (rel >= 0 && sk.length && rel <= sk.end(sk.length - 1) - 2) pv.currentTime = rel; else loadAt(t);
}
function localCmd(c) {
  switch (c.type) {
    case 'play': return playLocal(c.path);
    case 'toggle': pv.paused ? pv.play() : pv.pause(); break;
    case 'seek': seekLocal(c.to !== undefined ? Number(c.to) : cur() + Number(c.delta || 0)); break;
    case 'next': if (L.idx + 1 < L.queue.length) return playLocal(L.queue[L.idx + 1], true); break;
    case 'prev': if (cur() > 5 || L.idx <= 0) return seekLocal(0); return playLocal(L.queue[L.idx - 1], true);
    case 'volume': pv.volume = Number(c.value); break;
    case 'stop': return stopLocal();
    case 'track':
      if (!L.info) break;
      { const oldS = L.s, kind = (i) => (L.info.subKinds || [])[i];
        if (c.audio !== undefined) L.a = Number(c.audio);
        if (c.sub !== undefined) L.s = Number(c.sub);
        // Audio changes and image subtitles need a new converted stream; text subtitles are just a track swap.
        const reload = !L.info.direct && (c.audio !== undefined || kind(oldS) === 'bitmap' || kind(L.s) === 'bitmap');
        if (reload) loadAt(cur()); else { applySoftSub(); updateLocal(); } }
      break;
  }
}
['timeupdate', 'play', 'pause', 'durationchange', 'volumechange'].forEach((ev) => pv.addEventListener(ev, updateLocal));
pv.addEventListener('playing', () => { vm.loading = false; updateLocal(); });
pv.addEventListener('ended', () => localCmd({ type: 'next' }));
pv.addEventListener('error', () => { vm.error = "This phone's browser couldn't play the video"; updateLocal(); });
async function goFullscreen() {
  try {
    if (pv.requestFullscreen) { await pv.requestFullscreen(); try { await screen.orientation.lock('landscape'); } catch {} }
    else if (pv.webkitRequestFullscreen) pv.webkitRequestFullscreen();
    else if (pv.webkitEnterFullscreen) pv.webkitEnterFullscreen(); // iPhone: the system player, which has its own controls
  } catch {}
}
// Fullscreen hides the page's buttons, so give the video its own controls while it fills the screen.
function onFsChange() {
  const on = (document.fullscreenElement || document.webkitFullscreenElement) === pv;
  pv.controls = on;
  if (!on) { try { screen.orientation.unlock(); } catch {} }
}
document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);
$('fs').onclick = goFullscreen;
window.addEventListener('pagehide', stopSession);

if (phoneMode) resetLocalVm();
renderTarget(); render(); browse('');
</script>
</body>
</html>
